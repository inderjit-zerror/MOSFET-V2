<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Dark Triangle -->
    <linearGradient id="leftDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
    <!-- Left Light Quad -->
    <linearGradient id="leftLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
    <!-- Right Light Quad -->
    <linearGradient id="rightLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
    <!-- Right Dark Triangle -->
    <linearGradient id="rightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
  </defs>

  <!-- Left Peak -->
  <!-- Dark Triangle -->
  <polygon points="30,40 65,160 77,160" fill="url(#leftDark)" />
  <!-- Light Quad -->
  <polygon points="30,40 77,160 96,160 96,115" fill="url(#leftLight)" />

  <!-- Right Peak -->
  <!-- Light Quad -->
  <polygon points="170,40 123,160 104,160 104,115" fill="url(#rightLight)" />
  <!-- Dark Triangle -->
  <polygon points="170,40 135,160 123,160" fill="url(#rightDark)" />
</svg>
